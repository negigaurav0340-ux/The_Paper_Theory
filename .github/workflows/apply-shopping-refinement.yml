name: Apply reviewed compact catalogue update
on:
  push:
    branches: [shopping-refinement-update]
    paths: [.github/workflows/apply-shopping-refinement.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Verify and unpack reviewed changes
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path, PurePosixPath
          import hashlib, zipfile
          archive=Path('tpt-shopping-refinement.zip')
          assert hashlib.sha256(archive.read_bytes()).hexdigest() == 'b9cb459e99e1616e747fc33a576972730ca6e48b5e06edbcf009c56c36ac523c'
          with zipfile.ZipFile(archive) as z:
              for entry in z.infolist():
                  p=PurePosixPath(entry.filename)
                  assert not p.is_absolute() and '..' not in p.parts and '.git' not in p.parts and '.github' not in p.parts
                  assert (entry.external_attr >> 16) & 0o170000 != 0o120000
              z.extractall('.')
          archive.unlink()
          Path('.github/workflows/apply-shopping-refinement.yml').unlink()
          PYCODE
      - name: Build and verify
        run: |
          npm run build
          npm run check
      - name: Commit reviewed website changes
        run: |
          git config user.name 'negigaurav0340-ux'
          git config user.email 'negigaurav0340-ux@users.noreply.github.com'
          git add -A
          git commit -m 'Refine shopping counters, Polaroid photos and named sticker catalogue'
          git push origin HEAD:${{ github.ref_name }}
